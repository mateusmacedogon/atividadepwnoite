  <g class="line" fill="url(#metal)">
    <!-- Cada rotor é simétrico em torno de (0,0); o eixo fica fixo na parede. -->
    <g transform="translate(96 244)">
      <circle cy="2" r="21" fill="#794a40" opacity=".18" stroke="none"/>
      <g class="gear">
        <use href="#gear-shape"/>
        <circle r="11" fill="#91a6ad" stroke-width="2"/>
