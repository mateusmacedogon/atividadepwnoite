<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title">
  <title id="title">Fábrica Ventoy ilustrada, com telhados terracota, janelas iluminadas e engrenagens</title>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e0f2f1"/><stop offset="1" stop-color="#fff8e7"/></linearGradient>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f7bb92"/><stop offset="1" stop-color="#e18a6c"/></linearGradient>
    <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#e47f65"/><stop offset="1" stop-color="#ad534c"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e0faf5"/><stop offset="1" stop-color="#65a9b1"/></linearGradient>
    <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#dde6e4"/><stop offset="1" stop-color="#7e969c"/></linearGradient>
    <linearGradient id="door" x2="0" y2="1"><stop stop-color="#536581"/><stop offset="1" stop-color="#29384e"/></linearGradient>
    <path id="gear-shape" d="M-6.314 -15.244L-3.712 -16.077L-3.647 -20.681L3.647 -20.681L3.712 -16.077L6.314 -15.244L8.744 -13.993L12.045 -17.202L17.202 -12.045L13.993 -8.744L15.244 -6.314L16.077 -3.712L20.681 -3.647L20.681 3.647L16.077 3.712L15.244 6.314L13.993 8.744L17.202 12.045L12.045 17.202L8.744 13.993L6.314 15.244L3.712 16.077L3.647 20.681L-3.647 20.681L-3.712 16.077L-6.314 15.244L-8.744 13.993L-12.045 17.202L-17.202 12.045L-13.993 8.744L-15.244 6.314L-16.077 3.712L-20.681 3.647L-20.681 -3.647L-16.077 -3.712L-15.244 -6.314L-13.993 -8.744L-17.202 -12.045L-12.045 -17.202L-8.744 -13.993Z"/>
  </defs>
  <style>
    .line{stroke:#354052;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .smoke{animation:smoke 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .smoke2{animation-delay:-1.8s}
    .gear{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
    .gear-reverse{animation-direction:reverse;animation-duration:15.3s}
    @keyframes smoke{0%{opacity:0;transform:translateY(8px) scale(.65)}25%{opacity:.55}100%{opacity:0;transform:translateY(-28px) scale(1.4)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.smoke,.gear{animation:none}}
  </style>
