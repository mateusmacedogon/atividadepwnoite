<svg xmlns="http://www.w3.org/2000/svg" width="150" height="190" viewBox="0 0 150 190" role="img" aria-labelledby="title">
  <title id="title">Guilherme, de pele marrom escura, com capacete amarelo e macacão azul, segurando um pendrive</title>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a76b46"/><stop offset=".55" stop-color="#8b5437"/><stop offset="1" stop-color="#693b2b"/></linearGradient>
    <linearGradient id="helmet" x2=".7" y2="1"><stop stop-color="#ffe59a"/><stop offset=".5" stop-color="#f4bf48"/><stop offset="1" stop-color="#db9130"/></linearGradient>
    <linearGradient id="denim" x2="1" y2="1"><stop stop-color="#6a98c5"/><stop offset="1" stop-color="#345582"/></linearGradient>
    <linearGradient id="shirt" x2="1" y2="1"><stop stop-color="#f9edcb"/><stop offset="1" stop-color="#ddc7a1"/></linearGradient>
  </defs>
  <style>
    .line{stroke:#30394a;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .hero-character{animation:breathe 4.5s ease-in-out infinite;transform-box:view-box;transform-origin:75px 180px}
    .hero-eyes{animation:blink 6.2s linear infinite;transform-box:view-box;transform-origin:75px 71px}
    .hero-wave{animation:wave 6.2s ease-in-out infinite;transform-box:view-box;transform-origin:98px 105px}
    @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.008)}}
    @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}44.5%,45.5%{transform:scaleY(.08)}}
    @keyframes wave{0%,58%,88%,100%{transform:rotate(0deg)}65%,77%{transform:rotate(-6deg)}71%,83%{transform:rotate(-1deg)}}
    @media(prefers-reduced-motion:reduce){.hero-character,.hero-eyes,.hero-wave{animation:none}}
  </style>
